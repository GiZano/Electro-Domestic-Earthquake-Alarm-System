name: IoT CI

on:
  push:
    branches: [ "main", "develop" ]
    paths:
      - 'firmware/**'
      - 'research/**'
      - '.github/workflows/iot-ci.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'firmware/**'
      - 'research/**'
      - '.github/workflows/iot-ci.yml'

jobs:
  iot-ci:
    name: IoT Firmware Build Validation
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

    - name: Setup Python Environment
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.11'

    - name: Cache PlatformIO Packages
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: ~/.platformio
        key: ${{ runner.os }}-pio
        restore-keys: |
          ${{ runner.os }}-pio

    - name: Install PlatformIO CLI
      run: |
        python -m pip install pip==24.0
        pip install --only-binary :all: platformio==6.1.19

    - name: Inject CI Environment Variables
      run: |
        cd firmware
        cp esp32_config.env.example esp32_config.env

    - name: Validate Firmware Compilation
      run: |
        cd firmware
        pio run

    - name: Run Native Unit Tests
      run: |
        cd firmware
        g++ -std=c++11 -I src test/test_ringbuffer.cpp -o /tmp/test_ringbuffer
        /tmp/test_ringbuffer
        g++ -std=c++11 -I src test/test_detection.cpp -lm -o /tmp/test_detection
        /tmp/test_detection

    - name: Build Host SIL CLI (same core as firmware)
      run: |
        cd firmware
        g++ -std=c++11 -I src tools/detect_cli.cpp -lm -o /tmp/detect_cli

    - name: SIL Smoke Test (synthetic dataset)
      run: |
        python research/synthetic.py /tmp/synth_dataset --n-events 3
        cd research && python calibrate.py /tmp/synth_dataset --out /tmp/calibration.json