name: IoT CI

on:
  push:
    branches: [ "main", "develop" ]
    paths:
      - 'firmware/**'
      - '.github/workflows/iot-ci.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'firmware/**'
      - '.github/workflows/iot-ci.yml'

jobs:
  iot-ci:
    name: IoT Firmware Build Validation
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Setup Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Cache PlatformIO Packages
      uses: actions/cache@v4
      with:
        path: ~/.platformio
        key: ${{ runner.os }}-pio
        restore-keys: |
          ${{ runner.os }}-pio

    - name: Install PlatformIO CLI
      run: |
        python -m pip install --upgrade pip
        pip install --only-binary :all: platformio==6.1.19

    - name: Inject CI Environment Variables
      run: |
        cd firmware
        cp esp32_config.env.example esp32_config.env

    - name: Validate Firmware Compilation
      run: |
        cd firmware
        pio run

    - name: Run Native Unit Tests
      run: |
        cd firmware
        g++ -std=c++11 -I src test/test_ringbuffer.cpp -o /tmp/test_ringbuffer
        /tmp/test_ringbuffer
        g++ -std=c++11 -I src test/test_detection.cpp -lm -o /tmp/test_detection
        /tmp/test_detection