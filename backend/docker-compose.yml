services:
  # --- DATABASE ---
  postgres:
    image: postgis/postgis:15-3.4-alpine
    restart: unless-stopped
    command: postgres -c 'max_connections=200' -c 'shared_buffers=128MB'
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5

  # --- REDIS ---
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
    volumes:
      - redis_data:/data

  # --- MQTT BROKER (CI/test fallback) ---
  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "1883:1883"

  # --- API ---
  fastapi-app:
    build: .
    restart: always
    ports:
      - "${API_PORT}:8000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379/0
      - IOT_API_KEY=${IOT_API_KEY}
      - MOBILE_WS_TOKEN=${MOBILE_WS_TOKEN}
      - ENROLLMENT_TOKEN=${ENROLLMENT_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- WORKER ---
  worker:
    build: .
    restart: always
    command: python src/worker.py
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379/0
      - AI_REPORT_ENABLED=${AI_REPORT_ENABLED:-true}
      - PYTHONUNBUFFERED=1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  # --- MQTT BRIDGE ---
  mqtt-bridge:
    build: .
    restart: always
    command: python src/mqtt_subscriber.py
    environment:
      - MQTT_BROKER=${MQTT_BROKER:-mosquitto}
      - MQTT_PORT=${MQTT_PORT:-1883}
      - MQTT_USERNAME=${MQTT_USERNAME}
      - MQTT_PASSWORD=${MQTT_PASSWORD}
      - IOT_API_KEY=${IOT_API_KEY}
      - PYTHONUNBUFFERED=1
    depends_on:
      fastapi-app:
        condition: service_healthy

# --- LOCAL OLLAMA (AI Emergency Reports, v1.2.0) ---
  # Runs entirely on-premise inside the Docker network: telemetry never leaves the host.
  # Enabled via `--profile ai` (kept out of default `up` so CI stays hermetic).
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    profiles: ["ai"]
    entrypoint: ["/bin/sh"]
    command: ["/usr/local/bin/ollama-entrypoint.sh"]
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-5m}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2:1b}
    volumes:
      - ollama_data:/root/.ollama
      - ./init-scripts/ollama-entrypoint.sh:/usr/local/bin/ollama-entrypoint.sh:ro
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  # --- AI REPORT WORKER (v1.2.0) ---
  # Dedicated consumer of the ai_report_queue; generates reports via local Ollama.
  ai-worker:
    build: .
    restart: always
    profiles: ["ai"]
    command: python src/ai_report_worker.py
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379/0
      - OLLAMA_HOST=${OLLAMA_HOST:-http://ollama:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2:1b}
      - OLLAMA_TIMEOUT=${OLLAMA_TIMEOUT:-30}
      - PYTHONUNBUFFERED=1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      ollama:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  ollama_data:
