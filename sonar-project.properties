# --- General project keys ---
sonar.projectKey=GiZano_QuakeGuard
sonar.organization=gizano

# --- Source encoding ---
sonar.sourceEncoding=UTF-8

# --- Sources & tests ---
sonar.sources=.
sonar.exclusions=**/node_modules/**,**/.pio/**,**/.venv/**,**/dist/**,**/build/**,docs/web/**,docs/whitepaper/**
sonar.tests=backend/tests, firmware/test

# --- Duplication (CPD) ---
# lightMapStyle/darkMapStyle share the same featureType/elementType keys but are
# two independent palettes; structurally identical JSON is a known CPD false
# positive, so the map theme file is excluded from duplication analysis.
sonar.cpd.exclusions=mobile/theme/mapStyle.ts

# --- Python ---
sonar.python.version=3.10

